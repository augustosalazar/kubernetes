apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-demo
  template:
    metadata:
      labels:
        app: secret-demo
    spec:
      volumes:
        - name: secrets
          secret:
            # Se crea a mano ANTES del apply (ver el README). Si no existe, el
            # Pod se queda en ContainerCreating con "secret 'db-secret' not found".
            secretName: db-secret
            # Solo el dueno puede leer los archivos montados.
            defaultMode: 0400

      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "cat /secrets/password && sleep 3600"]
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
