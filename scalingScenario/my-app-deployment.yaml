# Un servidor HTTP deliberadamente LENTO: cada peticion tarda 2 segundos.
#
# No es nginx (el nombre anterior, "my-app-nginx-deployment", era enganoso y
# ademas chocaba con el Deployment de ../simpleNginx). Es un servidor Python
# minimo que duerme 2 s antes de responder, para que el efecto de escalar se
# note sin herramientas de carga.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-app-deployment
  labels:
    app: slow-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow-app
  template:
    metadata:
      labels:
        app: slow-app
    spec:
      containers:
        - name: slow-server
          image: python:3.11-slim
          command:
            - sh
            - -c
            - |
              python - << 'EOF'
              from http.server import HTTPServer, BaseHTTPRequestHandler
              import time, socket

              class Handler(BaseHTTPRequestHandler):
                  # Un solo hilo y una peticion cada vez: ESE es el cuello de
                  # botella que el ejercicio quiere ensenar. No lo conviertan en
                  # ThreadingHTTPServer o escalar dejara de notarse.

                  def responder(self, cuerpo, codigo=200):
                      datos = cuerpo.encode()
                      self.send_response(codigo)
                      self.send_header("Content-Type", "text/plain; charset=utf-8")
                      # Content-Length y Connection: close explicitos.
                      #
                      # Sin ellos el servidor cierra el socket sin avisar, y un
                      # cliente .NET (Windows PowerShell) guarda esa conexion ya
                      # muerta en su pool y la reutiliza: la peticion siguiente
                      # falla al instante con "Se ha terminado la conexion:
                      # error inesperado de recepcion". curl no se entera, .NET si.
                      self.send_header("Content-Length", str(len(datos)))
                      self.send_header("Connection", "close")
                      self.end_headers()
                      self.wfile.write(datos)

                  def do_GET(self):
                      # /healthz responde al instante: lo usa la readinessProbe.
                      # Si tambien durmiera 2 s, el Pod tardaria de mas en
                      # entrar al Service.
                      if self.path == "/healthz":
                          self.responder("ok\n")
                          return
                      time.sleep(2)
                      self.responder("Handled by %s\n" % socket.gethostname())

                  # Silencia el log por peticion: ensucia `kubectl logs`.
                  def log_message(self, *args):
                      pass

              class Servidor(HTTPServer):
                  # Cola de conexiones pendientes. Con el valor por defecto (5),
                  # medir con mucho paralelismo hace que el sistema operativo
                  # rechace las conexiones sobrantes en vez de encolarlas, y se
                  # miden errores en lugar de latencias.
                  request_queue_size = 128

              Servidor(("", 8080), Handler).serve_forever()
              EOF
          ports:
            - containerPort: 8080
          # Sin esto, al escalar el Service empieza a mandar trafico a Pods que
          # todavia no tienen el servidor Python arriba, y las mediciones salen
          # con errores de conexion en vez de con latencias.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
