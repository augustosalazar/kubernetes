# Service de tipo NodePort: expone los Pods fuera del cluster.
#
# OJO: el puerto 30080 tambien lo usaba scalingScenario. Para que los dos
# ejercicios puedan convivir, aquel se movio al 30081.
apiVersion: v1
kind: Service
metadata:
  name: my-app-nginx-service
spec:
  type: NodePort
  selector:
    app: my-app
  ports:
    - protocol: TCP
      port: 80         # Puerto del Service (dentro del cluster)
      targetPort: 80   # Puerto del contenedor (nginx escucha en 80)
      nodePort: 30080  # Puerto del nodo, accesible desde fuera
