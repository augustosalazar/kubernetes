# EXPERIMENTO 1: un Job que termina bien.
#
# Cuenta hasta SEGUNDOS imprimiendo una linea por segundo, para que puedan
# verlo avanzar en vivo y matarle el Pod a mitad de camino.
#
#   kubectl apply -f 02-job-que-termina.yaml
#   kubectl get pods -n ejercicio -o wide -w
#   kubectl logs -n ejercicio -l job-name=trabajo -f
#
# Mientras corre, en OTRA ventana:
#   kubectl delete pod -n ejercicio -l job-name=trabajo
#
# Observen: el Job crea un Pod NUEVO y la cuenta empieza otra vez desde 1.
# Ese Pod puede caer en un nodo distinto. Eso es autorreparacion.
apiVersion: batch/v1
kind: Job
metadata:
  name: trabajo
  namespace: ejercicio
spec:
  # Cuantos reintentos antes de darse por vencido.
  backoffLimit: 2
  # Corta el Job pase lo que pase, para que nada quede colgado.
  activeDeadlineSeconds: 600
  # El Job y sus Pods se borran solos 10 minutos despues de terminar.
  ttlSecondsAfterFinished: 600
  template:
    spec:
      # Never (no OnFailure): cada intento es un Pod NUEVO, que el scheduler
      # puede colocar en otro nodo. Comparen con 04-...-onfailure.yaml.
      restartPolicy: Never
      containers:
        - name: tarea
          image: busybox:1.36
          env:
            - name: SEGUNDOS
              # Dos minutos dan tiempo para observar los Pods, los logs y matar
              # uno a mitad de la ejecución sin tener que correr.
              value: "120"
            # API Downward: asi el contenedor sabe en que nodo cayo, sin
            # tener ningun acceso a la API de Kubernetes.
            - name: NODO
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["sh", "-c"]
          args:
            - |
              echo "nodo=$NODO  pod=$(hostname)"
              echo "voy a trabajar durante $SEGUNDOS segundos"
              i=1
              while [ $i -le $SEGUNDOS ]; do
                echo "  trabajando... $i/$SEGUNDOS"
                sleep 1
                i=$((i + 1))
              done
              echo "TERMINADO correctamente"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
