# EXPERIMENTO 2: un Job que SIEMPRE falla, con restartPolicy: Never.
#
#   kubectl apply -f 03-job-que-falla-never.yaml
#   kubectl get pods -n ejercicio -o wide -w
#
# Que esperar: con backoffLimit 2 apareceran TRES Pods distintos (1 intento +
# 2 reintentos), cada uno con su propio nombre, en estado Error. Entre uno y
# otro la espera crece: ~10s, ~20s, ~40s. Eso es el retroceso exponencial.
#
# Al final:
#   kubectl get job trabajo-falla-never -n ejercicio
#   kubectl describe job trabajo-falla-never -n ejercicio
#
# El Job queda con la condicion Failed y reason BackoffLimitExceeded.
# Cuenten los Pods: ese numero ES el numero de intentos.
apiVersion: batch/v1
kind: Job
metadata:
  name: trabajo-falla-never
  namespace: ejercicio
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: tarea
          image: busybox:1.36
          env:
            - name: NODO
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["sh", "-c"]
          args:
            - |
              echo "nodo=$NODO  pod=$(hostname)"
              echo "trabajando un poco antes de fallar..."
              sleep 5
              echo "fallo deliberado" >&2
              exit 1
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
